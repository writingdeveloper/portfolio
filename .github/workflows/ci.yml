# Vercel owns deployment; this workflow owns the checks that should fail before
# a change is allowed to reach it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Translation parity
        run: npm run untranslated

      - name: Verify hero images
        run: npm run verify:hero -- public/images/posts/*.webp

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
