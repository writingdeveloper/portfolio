# Vercel owns deployment; this workflow owns the checks that should fail before
# a change is allowed to reach it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Evidence and résumé integrity
        run: npm run evidence:check

      - name: Translation parity
        run: npm run untranslated

      - name: Verify hero images
        run: npm run verify:hero -- public/images/posts/*.webp

      - name: Build
        run: npm run build

      - name: Install browser for release QA
        run: npx playwright install --with-deps chromium

      - name: Production preview browser QA
        shell: bash
        run: |
          mkdir -p .qa/portfolio
          npm start -- -p 3100 -H localhost > .qa/portfolio/server.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3100/en/hire > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run qa:portfolio
          npm run qa:navigation
          QA_LOCALE=ko npm run qa:navigation

      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-browser-qa
          path: .qa/portfolio/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      # Always check production independently so a dev-tool advisory cannot
      # conceal any newly introduced runtime vulnerability.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Same threshold over every dependency. An advisory passes only when
      # .github/audit-exceptions.json lists it with an expiry and a review, and
      # every installed copy is dev-only; each pass is annotated on the run.
      - name: Audit dependencies
        run: npm run audit:deps
